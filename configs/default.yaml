document:
  id: wdr-2024-middle-income-trap
  title: "World Development Report 2024: The Middle-Income Trap"
  pdf_path: data/source/world-development-report-2024-full.pdf
  excluded_roots:
    - Boxes
    - Figures
    - Maps
    - Tables
  excluded_titles:
    - Front Cover
    - Contents
    - Acknowledgments
    - Glossary
    - Abbreviations
    - Notes
    - References

embedding:
  model: BAAI/bge-small-en-v1.5
  query_prefix: "Represent this sentence for searching relevant passages: "
  batch_size: 32

chunking:
  size_tokens: 400
  overlap_tokens: 80

retrieval:
  flat_top_k: 5
  structured_section_top_k: 3
  structured_passage_top_k: 5
  evidence_token_budget: 1600

generation:
  model: openai/gpt-oss-20b
  temperature: 0
  max_tokens: 900
  min_interval_seconds: 20

paths:
  artifacts_dir: artifacts
  questions_path: data/questions.pilot.jsonl
